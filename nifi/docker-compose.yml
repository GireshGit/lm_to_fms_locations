# Local NiFi 2.x for the POC: https://localhost:8443/nifi (admin / see SINGLE_USER_CREDENTIALS_PASSWORD)
services:
  nifi:
    image: apache/nifi:2.4.0
    ports:
      - "8443:8443"
    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: admin
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_PASSWORD:-change-me-12chars}
    volumes:
      - ./python_extensions:/opt/nifi/nifi-current/python_extensions
      - ./drivers:/opt/nifi/drivers:ro     # drop mssql-jdbc-*.jar and jt400-*.jar here
      - nifi-data:/opt/nifi/data
volumes:
  nifi-data:
