# Camel JBang picks these up when run from this folder (see ../README.md).
camel.jbang.dependencies=com.microsoft.sqlserver:mssql-jdbc:12.8.1.jre11,net.sf.jt400:jt400:20.0.7
camel.main.name=lm-to-fms-locations

# Schedule (Fabric: pipeline trigger). Quartz cron: sec min hour day-of-month month day-of-week.
# Every 15 min from 09:00 to 16:45, every day, in the JVM's time zone.
# Weekdays only: 0 0/15 9-16 ? * MON-FRI
lm.cron=0 0/15 9-16 * * ?
# Retry delay between the 5 retries of a failed step (Fabric retryIntervalInSeconds = 30)
lm.retryDelayMs=30000

# Pipeline parameters (Fabric defaults)
lm.maxLocationsPerRun=400
fms.library=FMSLIB
fms.defaultContactPhone=0000000001
fms.parallelism=12
# yyyy-MM-dd HH:mm:ss.SSS to replay a window without touching watermark.json; blank = normal run
lm.overrideBeginTs=

# Stand-in for the lakehouse staging folder (watermark.json, items/, runlog/)
lm.staging.dir=./data/lm2fms

# LocationManagement (SQL Server)
lm.db.host={{env:LM_DB_HOST:localhost}}
lm.db.port={{env:LM_DB_PORT:1433}}
lm.db.name={{env:LM_DB_NAME:LocationManagement}}
lm.db.user={{env:LM_DB_USER:}}
lm.db.password={{env:LM_DB_PASSWORD:}}
lm.db.trustServerCertificate={{env:LM_DB_TRUST_CERT:false}}

# FMS (DB2 for i via jt400)
fms.db.host={{env:FMS_DB_HOST:localhost}}
fms.db.user={{env:FMS_DB_USER:}}
fms.db.password={{env:FMS_DB_PASSWORD:}}

# Mail via SendGrid SMTP relay (Fabric used the SendGrid API through udf sendEmail)
mail.host=smtp.sendgrid.net
mail.port=587
mail.username=apikey
mail.password={{env:SENDGRID_API_KEY:}}
mail.from=noreply@enru.io
mail.to={{env:MTC_SUPPORT_EMAIL:}}
